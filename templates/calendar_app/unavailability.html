{% extends 'base.html' %}

{% block title %}Submit Unavailability — PRAVAAH{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:520px">

  <h2 class="mb-4" style="color:var(--orange);font-weight:800">Mark Unavailability</h2>

  {% if conflict %}
  <div class="alert alert-warning">
    ⚠ Conflict: you already have an approved block overlapping this period.
  </div>
  {% endif %}

  <div class="card shadow-sm border-0 p-4">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-semibold">Start Date</label>
        <input type="date" name="start_date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">End Date</label>
        <input type="date" name="end_date" class="form-control" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Reason</label>
        <textarea name="reason" class="form-control" rows="3"
                  placeholder="Briefly describe the reason..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Submit for Approval
      </button>
    </form>
  </div>

  <div class="mt-3 text-center">
    <a href="{% url 'monthly_view' %}" class="text-muted" style="font-size:.85rem">
      ← Back to Calendar
    </a>
  </div>

</div>
{% endblock %}
